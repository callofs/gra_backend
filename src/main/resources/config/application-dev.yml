server:
  port: 8080

logging:
  file:
    name: E:\graduation_project\log
  level:
    com.graProject: debug

spring:
  application:
    name: graProject
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3306/parenting_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      url: jdbc:mysql://localhost:3306/parenting_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      username: root
      password: 123456
      driver-class-name: com.mysql.cj.jdbc.Driver

  cloud:
    nacos:
      discovery:
        enabled: false

#swagger配置
knife4j:
  enable: true
  setting:
    language: zh_cn

oss:
  endpoint: oss-cn-beijing.aliyuncs.com
  bucket: lruof-gra-project
  access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
  access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
